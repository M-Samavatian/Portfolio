<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <meta
      name="description"
      content="دانلود QR Code راه‌های ارتباطی CHARGER STORE"
    />

    <meta name="theme-color" content="#111827" />

    <title>دانلود QR Code | CHARGER STORE</title>

    <!-- کتابخانه ساخت QR Code -->
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"
      defer
    ></script>

    <style>
      :root {
        --background-start: #f4f7fb;
        --background-end: #e8eef8;

        --card-background: rgba(255, 255, 255, 0.94);

        --text-primary: #111827;
        --text-secondary: #667085;

        --border-color: #e5e7eb;

        --shadow: 0 24px 70px rgba(15, 23, 42, 0.14);
        --button-shadow: 0 8px 24px rgba(15, 23, 42, 0.1);
      }

      * {
        box-sizing: border-box;
      }

      html {
        -webkit-text-size-adjust: 100%;
      }

      body {
        min-height: 100vh;
        margin: 0;

        font-family: Tahoma, Arial, sans-serif;

        color: var(--text-primary);

        background:
          radial-gradient(
            circle at top right,
            rgba(59, 130, 246, 0.18),
            transparent 36%
          ),
          linear-gradient(
            145deg,
            var(--background-start),
            var(--background-end)
          );
      }

      button {
        font-family: inherit;
      }

      .qr-page {
        min-height: 100vh;

        display: flex;
        align-items: center;
        justify-content: center;

        padding: max(24px, env(safe-area-inset-top)) 16px
          max(24px, env(safe-area-inset-bottom));
      }

      .qr-card {
        width: 100%;
        max-width: 470px;

        padding: 30px 20px 24px;

        background: var(--card-background);

        border: 1px solid rgba(255, 255, 255, 0.75);
        border-radius: 28px;

        box-shadow: var(--shadow);

        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);

        text-align: center;
      }

      .logo-wrapper {
        width: 94px;
        height: 94px;

        margin: 0 auto 18px;

        display: flex;
        align-items: center;
        justify-content: center;

        border-radius: 26px;

        background: #ffffff;

        box-shadow: 0 12px 32px rgba(15, 23, 42, 0.12);
      }

      .logo-placeholder {
        width: 76px;
        height: 76px;

        display: flex;
        align-items: center;
        justify-content: center;

        border-radius: 21px;

        color: #ffffff;

        background: linear-gradient(135deg, #111827, #2563eb);

        font-size: 25px;
        font-weight: 800;
        letter-spacing: 1px;
      }

      .qr-header {
        margin-bottom: 24px;
      }

      .qr-header h1 {
        margin: 0 0 9px;

        font-size: clamp(24px, 7vw, 31px);
        font-weight: 900;
        line-height: 1.3;
      }

      .qr-header p {
        margin: 0;

        color: var(--text-secondary);

        font-size: 14px;
        line-height: 1.9;
      }

      .qr-wrapper {
        width: 100%;
        min-height: 330px;

        margin-bottom: 18px;
        padding: 24px;

        display: flex;
        align-items: center;
        justify-content: center;

        background: #ffffff;

        border: 1px solid var(--border-color);
        border-radius: 22px;

        overflow: hidden;
      }

      #qrcode {
        width: 100%;

        display: flex;
        align-items: center;
        justify-content: center;
      }

      /*
       * QR در داخل صفحه کوچک نمایش داده می‌شود،
       * اما فایل اصلی همچنان 1000 در 1000 پیکسل است.
       */
      #qrcode canvas,
      #qrcode img {
        display: block;

        width: 100% !important;
        max-width: 280px;

        height: auto !important;

        image-rendering: pixelated;
      }

      .download-button {
        width: 100%;
        min-height: 56px;

        padding: 13px 18px;

        color: #ffffff;
        background: #111827;

        border: 0;
        border-radius: 16px;

        font-size: 15px;
        font-weight: 800;

        cursor: pointer;

        box-shadow: var(--button-shadow);

        transition:
          transform 180ms ease,
          box-shadow 180ms ease,
          opacity 180ms ease;
      }

      .download-button:hover {
        transform: translateY(-2px);

        box-shadow: 0 13px 30px rgba(15, 23, 42, 0.17);
      }

      .download-button:active {
        transform: scale(0.985);
      }

      .download-button:focus-visible {
        outline: 3px solid rgba(37, 99, 235, 0.28);
        outline-offset: 3px;
      }

      .download-button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
      }

      .page-address {
        margin: 18px 0 0;
        padding: 12px 14px;

        color: #475467;
        background: #f8fafc;

        border: 1px solid var(--border-color);
        border-radius: 13px;

        direction: ltr;
        text-align: center;

        font-family: Arial, sans-serif;
        font-size: 12px;
        line-height: 1.6;

        word-break: break-all;
      }

      .qr-note {
        margin: 16px 0 0;

        color: #98a2b3;

        font-size: 11px;
        line-height: 1.8;
      }

      .toast {
        position: fixed;

        right: 50%;
        bottom: 25px;

        width: max-content;
        max-width: calc(100% - 32px);

        padding: 12px 18px;

        color: #ffffff;
        background: rgba(17, 24, 39, 0.95);

        border-radius: 12px;

        font-size: 13px;
        line-height: 1.6;
        text-align: center;

        opacity: 0;
        visibility: hidden;

        transform: translate(50%, 15px);

        transition:
          opacity 180ms ease,
          visibility 180ms ease,
          transform 180ms ease;

        z-index: 100;
      }

      .toast.show {
        opacity: 1;
        visibility: visible;

        transform: translate(50%, 0);
      }

      @media (max-width: 380px) {
        .qr-card {
          padding-right: 14px;
          padding-left: 14px;

          border-radius: 23px;
        }

        .qr-wrapper {
          min-height: 290px;
          padding: 16px;
        }

        #qrcode canvas,
        #qrcode img {
          max-width: 250px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition: none !important;
        }
      }
      .logo-placeholder{width:auto;min-width:150px;padding:0 12px;border-radius:14px;font-size:19px;}
  </style>
  </head>

  <body>
    <main class="qr-page">
      <section class="qr-card">
        <div class="logo-wrapper">
          <div class="logo-placeholder">Samavatian</div>
        </div>

        <header class="qr-header">
          <h1>QR Code راه‌های ارتباطی</h1>

          <p>
            این QR Code کاربر را به صفحه رسمی راه‌های ارتباطی مجموعه هدایت
            می‌کند.
          </p>
        </header>

        <div class="qr-wrapper">
          <div id="qrcode" aria-label="QR Code صفحه راه‌های ارتباطی"></div>
        </div>

        <button
          id="downloadQrButton"
          class="download-button"
          type="button"
          disabled
        >
          دانلود QR Code با کیفیت بالا
        </button>

        <div id="pageAddress" class="page-address"></div>

        <p class="qr-note">
          برای کارت ویزیت، همین فایل PNG را دانلود و برای چاپ استفاده کنید.
        </p>
      </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script>
      "use strict";

      /*
      |--------------------------------------------------------------------------
      | تنظیمات QR Code
      |--------------------------------------------------------------------------
      | این آدرس باید همان آدرس دائمی صفحه راه‌های ارتباطی باشد.
      | تا وقتی این آدرس تغییر نکند، QR چاپ‌شده همچنان کار خواهد کرد.
      */

      const qrConfig = {
        pageUrl: new URL("./contact.html", window.location.href).href,

        fileName: "samavatian-contact-qr.png",

        size: 1000,
      };

      /*
      |--------------------------------------------------------------------------
      | دریافت عناصر صفحه
      |--------------------------------------------------------------------------
      */

      const elements = {
        qrCode: document.getElementById("qrcode"),

        downloadButton: document.getElementById("downloadQrButton"),

        pageAddress: document.getElementById("pageAddress"),

        toast: document.getElementById("toast"),
      };

      /*
      |--------------------------------------------------------------------------
      | نمایش پیام
      |--------------------------------------------------------------------------
      */

      function showToast(message) {
        elements.toast.textContent = message;

        elements.toast.classList.add("show");

        window.clearTimeout(showToast.timeoutId);

        showToast.timeoutId = window.setTimeout(() => {
          elements.toast.classList.remove("show");
        }, 2800);
      }

      /*
      |--------------------------------------------------------------------------
      | بررسی معتبر بودن آدرس
      |--------------------------------------------------------------------------
      */

      function isValidUrl(value) {
        try {
          const url = new URL(value);

          return url.protocol === "https:" || url.protocol === "http:";
        } catch {
          return false;
        }
      }

      /*
      |--------------------------------------------------------------------------
      | ساخت خودکار QR Code
      |--------------------------------------------------------------------------
      */

      function generateQrCode() {
        if (!isValidUrl(qrConfig.pageUrl)) {
          showToast("آدرس صفحه مقصد معتبر نیست.");
          return;
        }

        if (typeof QRCode === "undefined") {
          showToast("کتابخانه ساخت QR Code بارگذاری نشد.");
          return;
        }

        elements.qrCode.innerHTML = "";

        elements.downloadButton.disabled = true;

        elements.pageAddress.textContent = qrConfig.pageUrl;

        new QRCode(elements.qrCode, {
          text: qrConfig.pageUrl,

          width: qrConfig.size,
          height: qrConfig.size,

          colorDark: "#000000",
          colorLight: "#ffffff",

          correctLevel: QRCode.CorrectLevel.H,
        });

        /*
         * کمی صبر می‌کنیم تا Canvas توسط کتابخانه ساخته شود.
         */
        window.setTimeout(() => {
          const canvas = elements.qrCode.querySelector("canvas");
          const image = elements.qrCode.querySelector("img");

          if (!canvas && !image) {
            showToast("ساخت QR Code ناموفق بود.");
            return;
          }

          elements.downloadButton.disabled = false;
        }, 200);
      }

      /*
      |--------------------------------------------------------------------------
      | ساخت فایل PNG با حاشیه سفید مناسب چاپ
      |--------------------------------------------------------------------------
      */

      function createPrintableQrCanvas(sourceCanvas) {
        const quietZone = 80;

        const outputSize = sourceCanvas.width + quietZone * 2;

        const outputCanvas = document.createElement("canvas");

        outputCanvas.width = outputSize;
        outputCanvas.height = outputSize;

        const context = outputCanvas.getContext("2d");

        if (!context) {
          throw new Error("Canvas context is unavailable.");
        }

        /*
         * پس‌زمینه سفید و حاشیه امن اطراف QR
         */
        context.fillStyle = "#ffffff";

        context.fillRect(0, 0, outputCanvas.width, outputCanvas.height);

        context.drawImage(sourceCanvas, quietZone, quietZone);

        return outputCanvas;
      }

      /*
      |--------------------------------------------------------------------------
      | دانلود QR Code
      |--------------------------------------------------------------------------
      */

      function downloadQrCode() {
        const sourceCanvas = elements.qrCode.querySelector("canvas");

        if (!sourceCanvas) {
          showToast("QR Code هنوز آماده نشده است.");
          return;
        }

        try {
          const printableCanvas = createPrintableQrCanvas(sourceCanvas);

          const imageUrl = printableCanvas.toDataURL("image/png");

          const downloadLink = document.createElement("a");

          downloadLink.href = imageUrl;

          downloadLink.download = qrConfig.fileName;

          document.body.appendChild(downloadLink);

          downloadLink.click();

          downloadLink.remove();

          showToast("دانلود QR Code شروع شد.");
        } catch (error) {
          console.error(error);

          showToast("دانلود QR Code ناموفق بود.");
        }
      }

      /*
      |--------------------------------------------------------------------------
      | رویدادها
      |--------------------------------------------------------------------------
      */

      elements.downloadButton.addEventListener("click", downloadQrCode);

      /*
       * بعد از بارگذاری کامل صفحه و کتابخانه،
       * QR به‌صورت خودکار ساخته می‌شود.
       */
      window.addEventListener("load", generateQrCode);
    </script>
  </body>
</html>
